<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow | Modern Task Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-mark" aria-hidden="true">✓</span>
                <h1>Taskflow</h1>
            </div>
            <p>Organize your work, effortlessly.</p>
        </header>

        <div id="app-error" class="app-error hidden" role="alert"></div>

        <main>
            <div class="glass-card add-task-card">
                <form id="task-form">
                    <div class="input-group">
                        <input type="text" id="task-title" placeholder="What needs to be done?" required autocomplete="off" maxlength="200">
                        <input type="text" id="task-desc" placeholder="Details (optional)" autocomplete="off" maxlength="2000">
                    </div>
                    <button type="submit" class="primary-btn">Add Task</button>
                </form>
            </div>

            <div class="tasks-container">
                <div class="tasks-header">
                    <h2>Your Tasks</h2>
                    <span id="task-count" class="badge">0</span>
                </div>
                <p id="page-note" class="page-note hidden">Showing the first 50 tasks.</p>

                <div id="tasks-list" class="tasks-list">
                    <div class="empty-state hidden" id="empty-state">
                        <p>No tasks yet. Add one above!</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/app.js"></script>
</body>
</html>
